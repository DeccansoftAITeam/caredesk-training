name: AI review gate

# A blocking check: the job fails if the reviewer reports a blocker or high finding, or if the reviewer itself
# fails (the script fails closed). Make this job a REQUIRED status check in branch protection.
#
# Pull requests from forks get no secrets, so the review cannot run for them. The job must NOT be skipped for
# forks: GitHub counts a skipped required check as passing, which would let any fork PR bypass the gate. It fails
# closed instead, and a maintainer re-runs the review from a branch inside this repository.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.306"   # pin the CLI so the gate behaves the same every run

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail closed for pull requests from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Pull requests from forks get no secrets, so the AI review cannot run. Re-run it from a branch in this repository."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          node-version: "24"
      - name: Install Claude Code
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Review the diff (fails on blocker or high)
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # only this step can see the secret
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff "$BASE_SHA...$HEAD_SHA" | python scripts/ci_review.py haiku
